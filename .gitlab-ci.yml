# Ejecuta los tests en cada push y merge request.
tests:
  image: php:8.4-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libsqlite3-dev libicu-dev > /dev/null
    - docker-php-ext-install intl > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --no-progress
    - cp .env.example .env
    - php artisan key:generate
  script:
    - php artisan test
  cache:
    key: composer
    paths:
      - vendor/
